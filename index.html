<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="author" content="אפרת צפתי">
<title>Welcome to English School | © אפרת צפתי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Fredoka:wght@600;700&family=Baloo+2:wght@700;800&family=Varela+Round&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2064%2064%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22lgES%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23FF7EB6%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%238B6BFF%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2218%22%20fill%3D%22url%28%23lgES%29%22/%3E%3Cpath%20d%3D%22M13%2021a9%209%200%200%201%209-9h20a9%209%200%200%201%209%209v13a9%209%200%200%201-9%209H31l-9%208v-8a9%209%200%200%201-9-9z%22%20fill%3D%22%23fff%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2234.5%22%20text-anchor%3D%22middle%22%20font-family%3D%22Baloo%202%2CFredoka%2CArial%20Rounded%20MT%20Bold%2CArial%22%20font-weight%3D%22800%22%20font-size%3D%2218%22%20fill%3D%22%237A4FE0%22%3EES%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#FF7EB6">
<style>
:root{
  --pink:#FFE4F0;--pink2:#FF7EB6;--pink3:#D63B7E;
  --yellow:#FFF5CC;--yellow2:#FFD13B;--yellow3:#B88600;
  --blue:#E0F4FF;--blue2:#4CC3FF;--blue3:#1976B5;
  --mint:#DCF9EE;--mint2:#3AD69D;--mint3:#15875E;
  --lav:#EDE7FF;--lav2:#9B7BFF;--lav3:#5B39CC;
  --red:#FFD9DE;--red2:#F08A9A;
  --ink:#2C223B;--soft:#7B6F8C;--paper:#FFFFFF;
  --font:"Rubik","Varela Round","Segoe UI",Arial,sans-serif;
  --fun:"Fredoka","Rubik","Arial Rounded MT Bold","Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);min-height:100vh;background:#FFF9F3 radial-gradient(rgba(155,123,255,.09) 1.3px,transparent 1.5px) 0 0/24px 24px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
 radial-gradient(circle at 10% 15%,#FFE3EE 0,transparent 35%),
 radial-gradient(circle at 90% 20%,#DDF1FF 0,transparent 35%),
 radial-gradient(circle at 80% 90%,#FFF3C4 0,transparent 35%),
 radial-gradient(circle at 15% 85%,#E4F8EC 0,transparent 30%)}
button{font-family:inherit;color:inherit}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--fun)}
.hidden{display:none!important}
#deco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#deco span{position:absolute;font-size:34px;opacity:.22;animation:float 14s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-30px) rotate(10deg)}}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-bottom:3px solid var(--pink)}
.tb-mid{font-size:18px;font-weight:bold;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-side{display:flex;gap:6px;align-items:center;min-width:44px}
.icon-btn{width:46px;height:46px;border-radius:50%;border:0;background:var(--yellow);font-size:22px;cursor:pointer;box-shadow:0 3px 0 var(--yellow2);flex:none}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--yellow2)}
.chip{border:0;background:var(--blue);border-radius:30px;padding:8px 12px;font-size:15px;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 var(--blue2)}
.chip.fire{background:#FFE6CC;box-shadow:0 3px 0 #F5B571}

.screen{max-width:760px;margin:0 auto;padding:18px 16px 40px;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--paper);border-radius:28px;padding:22px;border:1px solid #F3EAF7;box-shadow:0 1px 2px rgba(44,34,59,.04),0 14px 34px rgba(44,34,59,.07);margin-bottom:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:12px 28px;border:0;border-radius:40px;font-size:19px;cursor:pointer;background:var(--pink2);color:#fff;box-shadow:0 5px 0 var(--pink3);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink3)}
.btn.yellow{background:var(--yellow2);color:#5a4300;box-shadow:0 5px 0 var(--yellow3)}
.btn.blue{background:var(--blue2);box-shadow:0 5px 0 var(--blue3)}
.btn.mint{background:var(--mint2);box-shadow:0 5px 0 var(--mint3)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #E6DDEA;border:2px solid #F0E8F3}
.btn.wide{width:100%}
.btn small{font-size:13px;opacity:.85;display:block}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}

/* home */
.hello-title{text-align:center;font-family:var(--fun);font-size:clamp(34px,8vw,58px);line-height:1.1;margin:18px 0 6px;direction:ltr}
.hello-title span{display:inline-block;animation:bounceIn .6s both}
.hello-title{font-weight:700}
.hello-title .tw>span{padding:0 1px;-webkit-text-stroke:2px rgba(255,255,255,.92);paint-order:stroke fill;text-shadow:0 5px 0 rgba(44,34,59,.18),0 10px 18px rgba(44,34,59,.12)}
.hello-title .sp{width:.3em}
.hello-title .tw{display:inline-block;white-space:nowrap;animation:none}
@keyframes bounceIn{0%{transform:translateY(-40px) scale(.4);opacity:0}70%{transform:translateY(6px) scale(1.1);opacity:1}100%{transform:none}}
.hello-sub{text-align:center;font-size:20px;margin-bottom:24px}
.mascot-line{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 22px}
.mascot{font-size:54px;display:inline-block}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.bubble{background:#fff;border-radius:22px;padding:12px 18px;font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.06);position:relative;max-width:440px}
.secs{display:grid;gap:18px}
.sec-card{display:flex;align-items:center;gap:18px;border:0;border-radius:34px;padding:22px 24px;cursor:pointer;text-align:right;width:100%;transition:transform .15s;animation:fadeIn .5s both}
.sec-card:hover{transform:scale(1.02) rotate(-.4deg)}
.sec-card:active{transform:scale(.98)}
.sec-card .se{font-size:60px;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;flex:none}
.sec-card h2{margin:0;font-size:28px}
.sec-card .sen{font-size:18px;opacity:.75}
.sec-card .sbar{height:10px;border-radius:6px;background:rgba(255,255,255,.7);margin-top:10px;overflow:hidden}
.sec-card .sbar i{display:block;height:100%;border-radius:6px}
.sec-card .ss{font-size:14px;margin-top:4px;opacity:.8}
.c-pink{background:var(--pink);box-shadow:0 7px 0 var(--pink2)}.c-pink .sbar i{background:var(--pink3)}
.c-yellow{background:var(--yellow);box-shadow:0 7px 0 var(--yellow2)}.c-yellow .sbar i{background:var(--yellow3)}
.c-blue{background:var(--blue);box-shadow:0 7px 0 var(--blue2)}.c-blue .sbar i{background:var(--blue3)}
.c-lav{background:var(--lav);box-shadow:0 7px 0 var(--lav2)}
.c-mint{background:var(--mint);box-shadow:0 7px 0 var(--mint2)}
.home-extra{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.pill{border:0;border-radius:30px;padding:12px 18px;font-size:16px;cursor:pointer;background:#fff;box-shadow:0 4px 0 #EFE6F2;position:relative}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 #EFE6F2}
.badge{position:absolute;top:-8px;left:-6px;background:var(--pink3);color:#fff;border-radius:20px;font-size:12px;padding:2px 7px}
.goal{background:#fff;border-radius:24px;padding:14px 18px;margin-top:22px;box-shadow:0 4px 0 #F3EAF5}
.goal-top{display:flex;justify-content:space-between;font-size:16px;margin-bottom:8px}
.goal-bar{height:14px;border-radius:8px;background:#F4EEF6;overflow:hidden}
.goal-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink2),var(--yellow2),var(--mint2));border-radius:8px;transition:width .6s}

/* map */
.map-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.map-head .me{font-size:52px}
.map-head h1{margin:0;font-size:28px}
.map-head .ms{font-size:16px;color:var(--soft)}
.world{border-radius:36px;padding:18px 12px 26px;margin-bottom:22px}
.world-title{text-align:center;font-size:22px;font-weight:bold;margin-bottom:4px}
.world-sub{text-align:center;font-size:14px;opacity:.7;margin-bottom:12px}
.path{display:flex;flex-direction:column;align-items:center}
.node-row{display:flex;flex-direction:column;align-items:center;position:relative}
.dots{height:26px;border-right:5px dotted rgba(74,63,92,.18);margin:2px 0}
.node{width:80px;height:80px;border-radius:50%;border:0;font-size:30px;font-family:var(--fun);cursor:pointer;color:#fff;position:relative;transition:transform .15s}
.node:active{transform:scale(.93)}
.node.done{background:var(--mint2);box-shadow:0 6px 0 var(--mint3)}
.node.open{background:var(--pink2);box-shadow:0 6px 0 var(--pink3);animation:pulse 1.6s infinite}
.node.locked{background:#E8E2EC;color:#A89DB3;box-shadow:0 6px 0 #D2C8D9;font-size:26px}
@keyframes pulse{0%{box-shadow:0 6px 0 var(--pink3),0 0 0 0 rgba(247,161,192,.7)}70%{box-shadow:0 6px 0 var(--pink3),0 0 0 18px rgba(247,161,192,0)}100%{box-shadow:0 6px 0 var(--pink3),0 0 0 0 rgba(247,161,192,0)}}
.node-stars{font-size:20px;letter-spacing:1px;height:26px;color:#F2B705;margin-top:6px}
.node-stars .off{color:#DDD3E3}
.here{position:absolute;top:8px;font-size:40px;animation:hop 1s ease-in-out infinite}
.here.l{right:-58px}.here.r{left:-58px}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* study card */
.study{text-align:center}
.flash{background:#fff;border-radius:36px;padding:26px 20px;box-shadow:0 8px 0 var(--pink),0 10px 24px rgba(0,0,0,.05);margin:8px auto 18px;max-width:460px;animation:pop .35s}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
.flash .fe{font-size:96px;line-height:1.1}
.flash .fl{width:110px;height:110px;margin:0 auto;border-radius:50%;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:56px;font-family:var(--fun)}
.flash .fw{font-size:46px;margin:10px 0 4px}
.flash .fh{font-size:26px;color:var(--pink3);margin-bottom:14px}
.flash .fs{background:#FBF7FD;border-radius:18px;padding:12px;font-size:17px;margin-top:14px}
.tools{display:flex;gap:10px;justify-content:center}
.tool{width:58px;height:58px;border-radius:50%;border:0;font-size:26px;cursor:pointer;background:var(--blue);box-shadow:0 4px 0 var(--blue2)}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue2)}
.tool.fav{background:var(--yellow);box-shadow:0 4px 0 var(--yellow2)}
.tool.fav.on{background:var(--yellow2)}
.mini{width:40px;height:40px;font-size:18px}
.studynav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px}
.dotsrow{display:flex;gap:6px;justify-content:center;margin:10px 0 18px;flex-wrap:wrap}
.dotsrow i{width:10px;height:10px;border-radius:50%;background:#EADFEF}
.dotsrow i.on{background:var(--pink3)}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:14px 0}
.witem{display:flex;align-items:center;gap:10px;background:#FBF7FD;border-radius:18px;padding:8px 12px;font-size:17px}
.witem b{font-size:19px}
.witem .sp2{flex:1}

/* rule */
.rule{font-size:19px;line-height:1.75}
.rule b{color:var(--pink3);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.ex{display:flex;align-items:center;gap:10px;background:#F2FAFF;border-radius:18px;padding:10px 14px;margin:8px 0;font-size:19px}

/* play */
.play-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pbar{flex:1;height:18px;border-radius:10px;background:#F1EAF4;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--pink2),var(--yellow2));transition:width .4s}
.combo{font-size:18px;background:#FFE6CC;border-radius:20px;padding:4px 12px;min-width:62px;text-align:center}
.clock{font-family:var(--fun);font-size:30px;width:78px;height:78px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--blue2);flex:none}
.clock.hurry{background:var(--red);box-shadow:0 5px 0 var(--red2);animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.score{font-size:22px;font-family:var(--fun)}
.ins{text-align:center;font-size:20px;color:var(--soft);margin:4px 0}
.ask{text-align:center;margin:10px 0 20px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.q-word{font-size:clamp(38px,9vw,58px);font-weight:bold}
.q-emoji{font-size:110px;line-height:1.1;animation:pop .35s}
.q-listen{width:130px;height:130px;border-radius:50%;border:0;background:var(--blue);font-size:64px;cursor:pointer;box-shadow:0 7px 0 var(--blue2);animation:pulse2 1.8s infinite}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.q-sent{font-size:clamp(22px,5.5vw,32px);line-height:1.5}
.q-he{font-size:18px;color:var(--soft);margin-top:8px}
.blank{display:inline-block;min-width:110px;border-bottom:5px solid var(--pink2);color:var(--pink3);font-weight:bold;padding:0 6px}
.blank.fill{border-color:var(--mint2);color:var(--mint3);animation:pop .3s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{min-height:78px;border:3px solid #EFE6F2;background:#fff;border-radius:24px;font-size:22px;cursor:pointer;padding:10px;box-shadow:0 5px 0 #EFE6F2;transition:transform .08s}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 #EFE6F2}
.opt .num{font-size:13px;color:#B9AEC4;display:block}
.opt.ok{background:var(--mint);border-color:var(--mint2);box-shadow:0 5px 0 var(--mint2);animation:jump .4s}
.opt.bad{background:var(--red);border-color:var(--red2);box-shadow:0 5px 0 var(--red2);animation:shake .3s 2}
.opt.dim{opacity:.45}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:16px 18px 22px;border-radius:30px 30px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.08);animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.fb.good{background:var(--mint)}.fb.badfb{background:#FFE9EC}
.fb-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fb-t{flex:1;min-width:200px;font-size:20px}
.fb-t small{display:block;font-size:16px;opacity:.8;margin-top:2px}

/* result */
.result{text-align:center}
.bigstars{font-size:70px;margin:8px 0;letter-spacing:6px}
.bigstars span{display:inline-block;color:#E5DCEB;transform:scale(.3)}
.bigstars span.on{color:#F7C12E;animation:starPop .5s forwards;text-shadow:0 4px 0 #D99B00}
.bigstars span.off{animation:starOff .4s forwards}
@keyframes starPop{0%{transform:scale(.3) rotate(-60deg)}70%{transform:scale(1.35) rotate(10deg)}100%{transform:scale(1)}}
@keyframes starOff{to{transform:scale(1)}}
.result h1{font-size:30px;margin:6px 0}
.mistakes{text-align:right;margin-top:16px}

/* profile */
.rank-big{text-align:center}
.rank-big .re{font-size:80px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:14px 0}
.stat{background:#FBF7FD;border-radius:22px;padding:14px;text-align:center}
.stat b{display:block;font-size:28px;font-family:var(--fun)}
.troph{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.tro{border-radius:24px;padding:14px 8px;text-align:center;background:#F4F0F6;color:#A99DB4}
.tro .te{font-size:44px;filter:grayscale(1);opacity:.45}
.tro.got{background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 var(--yellow2)}
.tro.got .te{filter:none;opacity:1}
.tro b{display:block;font-size:15px;margin:4px 0}
.tro small{font-size:12px}

/* welcome */
.welcome{text-align:center;padding-top:30px}
.welcome input{width:100%;max-width:340px;font-size:24px;padding:14px 20px;border-radius:30px;border:3px solid var(--pink);text-align:center;font-family:inherit;outline:none}
.welcome input:focus{border-color:var(--pink2)}
.gsel{display:flex;gap:12px;justify-content:center;margin:18px 0}
.gbtn{border:3px solid #EFE6F2;background:#fff;border-radius:26px;padding:12px 22px;font-size:20px;cursor:pointer}
.gbtn.on{border-color:var(--pink2);background:var(--pink)}
.err{color:#C2185B;font-size:15px;min-height:22px;margin-top:6px}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.balloon{position:absolute;bottom:-170px;width:66px;height:82px;border-radius:50% 50% 48% 52%/60% 60% 40% 40%;animation:rise linear forwards}
.balloon::before{content:"";position:absolute;top:14px;left:15px;width:13px;height:22px;border-radius:50%;background:rgba(255,255,255,.6)}
.balloon::after{content:"";position:absolute;bottom:-72px;left:32px;width:2px;height:72px;background:rgba(120,110,130,.4)}
@keyframes rise{0%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-62vh) rotate(6deg)}100%{transform:translateY(-135vh) rotate(-5deg)}}
.conf{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#toast{position:fixed;top:84px;left:50%;transform:translateX(-50%) translateY(-30px);background:#fff;border-radius:30px;padding:14px 24px;font-size:19px;box-shadow:0 8px 26px rgba(0,0,0,.13);z-index:60;opacity:0;transition:all .35s;pointer-events:none;text-align:center;max-width:92vw;border:3px solid var(--yellow2)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#cheer{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(.4);font-size:40px;font-family:var(--fun);color:var(--pink3);z-index:55;opacity:0;transition:all .3s;pointer-events:none;text-shadow:0 4px 0 #fff,0 0 20px #fff;text-align:center;white-space:nowrap}
#cheer.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-radius:24px;padding:14px 18px;margin:0 0 18px;color:#fff;background:linear-gradient(135deg,#2C223B,#463263);border:2px solid rgba(255,209,59,.65);box-shadow:0 12px 28px rgba(44,34,59,.2);animation:fadeIn .4s}
.banner.done{background:linear-gradient(135deg,#15875E,#23A97A);border-color:rgba(255,255,255,.5)}
.banner b{font-size:17px;display:block}.banner small{font-size:14px;opacity:.9}
.banner .bb{border:0;border-radius:30px;background:var(--yellow2);color:#2C223B;font-size:15px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 0 #C49500;white-space:nowrap}
.pt-bars{display:flex;gap:6px;margin:6px 0 16px}.pt-bars i{flex:1;height:10px;border-radius:6px;background:#ECE4F2}.pt-bars i.done{background:var(--mint2)}.pt-bars i.cur{background:var(--pink2)}
.band{display:inline-block;font-size:22px;padding:10px 22px;border-radius:30px;background:var(--mint);color:var(--mint3);margin:10px 0}
.fit-tag{font-size:13px;background:var(--lav2);color:#fff;border-radius:20px;padding:3px 10px;margin-top:4px}
.rail{position:fixed;z-index:25;display:flex;gap:6px}

e</b> + פועל + <b>ing</b>.<br>I am eating = אני אוכלת עכשיו.","ex":[["I am reading now.","אני קוראת עכשיו."],["It is raining.","יורד גשם."],["They are playing.","הם משחקים."]],"q":[["Look! It ___ raining.","is","are","am","תראו! יורד גשם."],["I am ___ a message right now.","writing","write","writes","אני כותבת הודעה ממש עכשיו."],["They ___ watching TV at the moment.","are","is","be","הם צופים בטלוויזיה כרגע."],["She isn't ___ now. She's sleeping.","working","work","works","היא לא עובדת עכשיו. היא ישנה."],["What ___ you doing?","are","is","do","מה אתם עושים?"],["We are ___ for the bus.","waiting","wait","waits","אנחנו מחכים לאוטובוס."]]},{"e":"☀️","t":"הווה פשוט: Present Simple","rule":"להרגלים ולעובדות. עם <b>he / she / it</b> מוסיפים <b>s</b> (או <b>es</b>) לפועל: I work ← she works, watch ← watches.","ex":[["I work in a bank.","אני עובדת בבנק."],["She drinks coffee every day.","היא שותה קפה כל יום."],["Water boils at 100 degrees.","מים רותחים ב־100 מעלות."]],"q":[["She ___ coffee every morning.","drinks","drink","drinking","היא שותה קפה כל בוקר."],["I ___ in a bank.","work","works","working","אני עובדת בבנק."],["The shop ___ at nine.","opens","open","opening","החנות נפתחת בתשע."],["My parents ___ in Haifa.","live","lives","living","ההורים שלי גרים בחיפה."],["He ___ TV every evening.","watches","watch","watchs","הוא צופה בטלוויזיה כל ערב."],["Water ___ at 100 degrees.","boils","boil","boiling","מים רותחים ב־100 מעלות."]]},{"e":"❓","t":"שאלות כן/לא ושאלות Wh","rule":"שאלת כן/לא: הופכים את הסדר (<b>Are you...? Can you...?</b>) או מוסיפים <b>Do / Does</b>.<br>שאלות Wh: <b>What</b> מה · <b>Where</b> איפה · <b>When</b> מתי · <b>Who</b> מי · <b>Why</b> למה · <b>How</b> איך · <b>How much</b> כמה (כסף).","ex":[["Where do you live?","איפה אתם גרים?"],["Do you speak English?","אתם מדברים אנגלית?"],["How much is it?","כמה זה עולה?"]],"q":[["___ do you live? (I live in Tel Aviv.)","Where","When","Who","איפה את גרה? (אני גרה בתל אביב.)"],["___ is your name?","What","Who","Where","מה השם שלך?"],["___ you speak English?","Do","Are","Does","אתם מדברים אנגלית?"],["___ she a student?","Is","Does","Do","היא סטודנטית?"],["___ is this shirt? (It's 20 dollars.)","How much","How many","What time","כמה עולה החולצה הזאת? (20 דולר.)"],["___ are you sad? (Because I lost my keys.)","Why","When","Where","למה את עצובה? (כי איבדתי את המפתחות.)"]]},{"e":"🚫","t":"משפטי שלילה","rule":"<b>don't</b> / <b>doesn't</b> + פועל (I don't like, she doesn't like).<br>עם be: <b>isn't, aren't, I'm not</b>. עם can: <b>can't</b>.","ex":[["I don't like coffee.","אני לא אוהבת קפה."],["He doesn't speak French.","הוא לא מדבר צרפתית."],["They aren't here.","הם לא כאן."]],"q":[["I ___ like coffee.","don't","doesn't","not","אני לא אוהבת קפה."],["He ___ speak French.","doesn't","don't","isn't","הוא לא מדבר צרפתית."],["They ___ at home now.","aren't","don't","isn't","הם לא בבית עכשיו."],["She ___ a teacher.","isn't","doesn't","aren't","היא לא מורה."],["I ___ swim. I never learned.","can't","don't can","not can","אני לא יודעת לשחות. אף פעם לא למדתי."],["We ___ have a car.","don't","doesn't","aren't","אין לנו מכונית."]]},{"e":"🍎","t":"ספירים ולא ספירים","rule":"ספירים אפשר לספור: an apple, two apples.<br>לא ספירים אי אפשר לספור: <b>water, money, information, advice, bread, rice</b>. אין להם a ואין להם s.","ex":[["two apples","שני תפוחים"],["some water","קצת מים"],["good advice","עצה טובה"]],"q":[["Can I have some ___?","water","waters","a water","אפשר קצת מים?"],["I need some ___ about the trip.","information","informations","an information","אני צריכה קצת מידע על הטיול."],["She gave me some good ___.","advice","advices","an advice","היא נתנה לי עצה טובה."],["I bought three ___.","apples","apple","an apples","קניתי שלושה תפוחים."],["We don't have much ___.","money","moneys","a money","אין לנו הרבה כסף."],["There are two ___ on the table.","books","book","a books","יש שני ספרים על השולחן."]]},{"e":"⚖️","t":"כמויות: some, any, much, many...","rule":"<b>some</b> קצת (במשפט חיובי) · <b>any</b> (בשאלה ובשלילה)<br><b>many</b> הרבה (ספירים) · <b>much</b> הרבה (לא ספירים) · <b>a lot of</b> הרבה (לשניהם)<br><b>a few</b> כמה (ספירים) · <b>a little</b> קצת (לא ספירים)","ex":[["How many apples?","כמה תפוחים?"],["How much money?","כמה כסף?"],["a little salt","קצת מלח"]],"q":[["How ___ apples do you want?","many","much","כמה תפוחים את רוצה?"],["How ___ money do you have?","much","many","כמה כסף יש לך?"],["Is there ___ milk in the fridge?","any","many","a few","יש חלב במקרר?"],["I have ___ friends in London, maybe three.","a few","a little","much","יש לי כמה חברים בלונדון, אולי שלושה."],["Add ___ salt, please. Not too much.","a little","a few","many","בבקשה להוסיף קצת מלח. לא יותר מדי."],["There are ___ people in the park today.","a lot of","much","a little","יש הרבה אנשים בפארק היום."]]},{"e":"✨","t":"שמות תואר ותוארי פועל","rule":"שם תואר מתאר שם עצם: a <b>careful</b> driver.<br>תואר פועל מתאר איך עושים פעולה, בדרך כלל עם <b>ly</b>: drive <b>carefully</b>.<br>יוצאי דופן: good ← <b>well</b>, fast ← <b>fast</b>, hard ← <b>hard</b>.","ex":[["She is a careful driver.","היא נהגת זהירה."],["She drives carefully.","היא נוהגת בזהירות."],["He speaks English well.","הוא מדבר אנגלית טוב."]],"q":[["She is a ___ driver.","careful","carefully","היא נהגת זהירה."],["Please drive ___.","carefully","careful","בבקשה לנהוג בזהירות."],["He speaks English very ___.","well","good","הוא מדבר אנגלית טוב מאוד."],["This is a ___ book.","good","well","זה ספר טוב."],["The children played ___ in the garden.","quietly","quiet","הילדים שיחקו בשקט בגינה."],["He runs very ___.","fast","fastly","הוא רץ מהר מאוד."]]},{"e":"📏","t":"השוואה והפלגה","rule":"מילה קצרה: <b>-er than</b> / <b>the -est</b>: big ← bigger ← the biggest.<br>מילה ארוכה: <b>more ... than</b> / <b>the most</b>: more expensive.<br>יוצאי דופן: good ← <b>better</b> ← <b>the best</b>, bad ← <b>worse</b> ← <b>the worst</b>.","ex":[["bigger than","גדול יותר מ־"],["the most beautiful","הכי יפה"],["the best day","היום הכי טוב"]],"q":[["My bag is ___ than yours.","heavier","heavyer","more heavy","התיק שלי כבד יותר משלך."],["This is the ___ day of my life!","best","better","goodest","זה היום הכי טוב בחיים שלי!"],["Tel Aviv is ___ than my town.","bigger","biger","more big","תל אביב גדולה יותר מהעיר שלי."],["She is the ___ student in the class.","smartest","smarter","most smart","היא התלמידה הכי חכמה בכיתה."],["This hotel is ___ than the other one.","more expensive","expensiver","most expensive","המלון הזה יקר יותר מהשני."],["The weather today is ___ than yesterday.","worse","worst","badder","מזג האוויר היום גרוע יותר מאתמול."]]},{"e":"⏪","t":"עבר פשוט: Past Simple","rule":"פעולה שהתחילה והסתיימה בעבר.<br><b>was</b> (I, he, she, it) · <b>were</b> (you, we, they) · <b>had</b> = היה לי.<br>פעלים רגילים: <b>-ed</b> (visited). חריגים: went, ate, saw, bought, took.<br>בשאלה ובשלילה: <b>did / didn't</b> + פועל רגיל.","ex":[["I was at home.","הייתי בבית."],["We had a great time.","היה לנו זמן נהדר."],["She bought a phone.","היא קנתה טלפון."]],"q":[["I ___ at home yesterday.","was","were","am","הייתי בבית אתמול."],["We ___ very tired last night.","were","was","are","היינו עייפים מאוד אתמול בלילה."],["She ___ a new phone last week.","bought","buyed","buys","היא קנתה טלפון חדש בשבוע שעבר."],["They ___ a great time in Rome.","had","haved","has","היה להם זמן נהדר ברומא."],["I ___ my grandmother on Friday.","visited","visit","visiting","ביקרתי את סבתא שלי ביום שישי."],["Did you ___ the movie?","see","saw","seen","ראית את הסרט?"]]},{"e":"🎞️","t":"עבר ממושך: Past Progressive","rule":"<b>was / were</b> + פועל + <b>ing</b>: פעולה שהייתה באמצע ברגע מסוים בעבר.<br>הרבה פעמים עם when: I <b>was cooking</b> when he called.","ex":[["I was cooking when he called.","בישלתי כשהוא התקשר."],["They were watching TV.","הם צפו בטלוויזיה."]],"q":[["I ___ a shower when the phone rang.","was taking","am taking","take","הייתי במקלחת כשהטלפון צלצל."],["They ___ TV when I arrived.","were watching","was watching","are watching","הם צפו בטלוויזיה כשהגעתי."],["What ___ you doing at 10 last night?","were","was","are","מה עשיתם אתמול בעשר בלילה?"],["She ___ sleeping when the baby cried.","was","were","is","היא ישנה כשהתינוק בכה."],["It ___ raining all morning yesterday.","was","were","is","ירד גשם כל הבוקר אתמול."],["We were ___ to the beach when we saw the accident.","driving","drive","drove","נסענו לחוף כשראינו את התאונה."]]},{"e":"🔮","t":"עתיד: will / be going to","rule":"<b>will</b> + פועל: החלטה של הרגע, הבטחה או ניחוש. שלילה: <b>won't</b>.<br><b>be going to</b> + פועל: תוכנית שכבר החלטנו עליה, או משהו שרואים שעומד לקרות.","ex":[["I will call you.","אני אתקשר אלייך."],["We are going to fly to Paris.","אנחנו טסים לפריז (כבר תכננו)."]],"q":[["I think it ___ rain tomorrow.","will","is","was","אני חושבת שמחר ירד גשם."],["I'm hungry. (Wait,) I ___ make you a sandwich!","will","am","was","אני רעבה. (רגע,) אני אכין לך כריך!"],["We are ___ to fly to Paris next month.","going","go","will","אנחנו טסים לפריז בחודש הבא."],["She is going to ___ a new car.","buy","buys","buying","היא הולכת לקנות מכונית חדשה."],["Don't worry, I ___ tell anyone.","won't","don't","am not","אל תדאגי, אני לא אספר לאף אחד."],["Look at the clouds! It's ___ to rain.","going","will","go","תסתכלו על העננים! עומד לרדת גשם."]]},{"e":"💪","t":"פעלים מודאליים 1: can, could, may, might","rule":"<b>can</b> = יכול, יודע · <b>could</b> = יכולתי (עבר), או בקשה מנומסת<br><b>may</b> = רשות מנומסת · <b>might</b> = אולי, יש סיכוי<br>אחריהם תמיד פועל בסיסי, בלי to ובלי s.","ex":[["I can swim.","אני יודעת לשחות."],["Could you help me?","תוכלו לעזור לי?"],["It might rain.","אולי ירד גשם."]],"q":[["When I was five, I ___ swim.","could","can","may","כשהייתי בת חמש ידעתי לשחות."],["___ you help me, please?","Could","Might","Should","תוכלו לעזור לי, בבקשה?"],["She can ___ three languages.","speak","speaks","speaking","היא יודעת לדבר שלוש שפות."],["Take an umbrella. It ___ rain later.","might","mustn't","can't","קחו מטרייה. אולי ירד גשם אחר כך."],["___ I come in?","May","Must","Would","אפשר להיכנס?"],["I ___ hear you. The music is too loud.","can't","mustn't","might","אני לא שומעת אותך. המוזיקה חזקה מדי."]]},{"e":"📜","t":"פעלים מודאליים 2: must, have to, should, would","rule":"<b>must</b> = חייב · <b>mustn't</b> = אסור<br><b>have to / has to</b> = צריך (בגלל הנסיבות)<br><b>should</b> = כדאי (עצה) · <b>would</b> = הייתי... · <b>Would you like</b> = תרצו?","ex":[["You must wear a seatbelt.","חובה לחגור חגורת בטיחות."],["You should rest.","כדאי לך לנוח."],["Would you like tea?","תרצו תה?"]],"q":[["You ___ smoke here. It's not allowed.","mustn't","don't have to","should","אסור לעשן כאן. זה לא מותר."],["You look tired. You ___ go to bed.","should","mustn't","would","את נראית עייפה. כדאי לך ללכת לישון."],["She ___ to work on Saturdays.","has","have","must","היא צריכה לעבוד בשבתות."],["___ you like some tea?","Would","Should","Must","תרצו קצת תה?"],["I ___ love to visit Japan.","would","should","must","הייתי שמחה מאוד לבקר ביפן."],["We ___ wear a seatbelt in the car. It's the law.","must","would","might","חובה לחגור חגורה במכונית. זה החוק."]]},{"e":"🔗","t":"מילות קישור","rule":"<b>and</b> = ו · <b>but</b> = אבל · <b>or</b> = או · <b>because</b> = כי · <b>so</b> = לכן<br><b>although</b> = למרות ש · <b>however</b> = עם זאת (בתחילת משפט חדש, עם פסיק).","ex":[["I was tired, so I slept.","הייתי עייפה, לכן ישנתי."],["Although it rained, we went out.","למרות שירד גשם, יצאנו."]],"q":[["I like tea ___ coffee.","and","but","because","אני אוהבת תה וקפה."],["I was tired, ___ I went to bed early.","so","because","although","הייתי עייפה, לכן הלכתי לישון מוקדם."],["She stayed home ___ she was sick.","because","so","but","היא נשארה בבית כי היא הייתה חולה."],["___ it was raining, we went to the beach.","Although","Because","So","למרות שירד גשם, הלכנו לחוף."],["The hotel was nice. ___, the food was bad.","However","Because","And","המלון היה נחמד. עם זאת, האוכל היה גרוע."],["Do you want pizza ___ pasta?","or","so","because","אתם רוצים פיצה או פסטה?"]]},{"e":"✅","t":"הווה מושלם: Present Perfect","rule":"<b>have / has</b> + פועל בצורה השלישית (V3): been, eaten, finished.<br>מתאים לניסיון (I have been to London), למשהו שקרה עכשיו, ולמשהו שנמשך עד היום (<b>since</b> = מאז, <b>for</b> = במשך).<br>מילים נפוצות: ever, never, already, yet, just.","ex":[["I have been to London.","הייתי בלונדון (פעם בחיים)."],["She has finished.","היא סיימה."],["We have lived here since 2020.","אנחנו גרים כאן מאז 2020."]],"q":[["I ___ been to London twice.","have","has","am","הייתי בלונדון פעמיים."],["She has ___ her homework.","finished","finish","finishing","היא סיימה את שיעורי הבית."],["Have you ever ___ sushi?","eaten","ate","eat","אכלת פעם סושי?"],["We ___ lived here since 2020.","have","has","are","אנחנו גרים כאן מאז 2020."],["He hasn't called me ___.","yet","already","ago","הוא עוד לא התקשר אליי."],["I have known her ___ ten years.","for","since","ago","אני מכירה אותה כבר עשר שנים."]]},{"e":"⏳","t":"Present Perfect Progressive","rule":"<b>have / has been</b> + פועל + <b>ing</b>: פעולה שהתחילה בעבר ועדיין נמשכת. מדגישים כמה זמן.<br>I have been waiting for an hour = אני מחכה כבר שעה.","ex":[["I have been waiting for an hour.","אני מחכה כבר שעה."],["It has been raining since morning.","יורד גשם מהבוקר."]],"q":[["I have been ___ for you for an hour!","waiting","waited","wait","אני מחכה לך כבר שעה!"],["She ___ been studying English since September.","has","have","is","היא לומדת אנגלית מאז ספטמבר."],["How long have you ___ working here?","been","being","be","כמה זמן אתם עובדים כאן?"],["They have been ___ all day. They're tired.","walking","walked","walk","הם הולכים כל היום. הם עייפים."],["It ___ been raining since the morning.","has","have","is","יורד גשם מהבוקר."],["We have been living here ___ five years.","for","since","ago","אנחנו גרים כאן כבר חמש שנים."]]},{"e":"🔁","t":"שאלות זנב: Tag Questions","rule":"שאלה קצרה בסוף המשפט, כמו \"נכון?\".<br>משפט חיובי ← זנב שלילי: You are tired, <b>aren't you?</b><br>משפט שלילי ← זנב חיובי: She isn't here, <b>is she?</b><br>משתמשים באותו פועל עזר שבמשפט (is, can, will, did...).","ex":[["You are tired, aren't you?","את עייפה, נכון?"],["She can't swim, can she?","היא לא יודעת לשחות, נכון?"]],"q":[["You are Israeli, ___?","aren't you","are you","don't you","את ישראלית, נכון?"],["She can swim, ___?","can't she","can she","doesn't she","היא יודעת לשחות, נכון?"],["They don't eat meat, ___?","do they","don't they","are they","הם לא אוכלים בשר, נכון?"],["He went to Paris, ___?","didn't he","did he","wasn't he","הוא נסע לפריז, נכון?"],["It isn't cold today, ___?","is it","isn't it","does it","לא קר היום, נכון?"],["You will call me, ___?","won't you","will you","don't you","תתקשרי אליי, נכון?"]]},{"e":"🧩","t":"פסוקיות זיקה","rule":"מחברים מידע על משהו שכבר הזכרנו:<br><b>who</b> = ש־ (לאנשים) · <b>which</b> = ש־ (לדברים) · <b>that</b> = ש־ (לשניהם)<br><b>where</b> = שבו (למקום) · <b>whose</b> = ש...שלו (שייכות)","ex":[["The woman who lives next door.","האישה שגרה בבית ליד."],["The hotel where we stayed.","המלון שבו לנו."]],"q":[["The woman ___ lives next door is a doctor.","who","which","where","האישה שגרה בבית ליד היא רופאה."],["This is the book ___ I told you about.","which","who","where","זה הספר שסיפרתי לך עליו."],["This is the hotel ___ we stayed last year.","where","which","who","זה המלון שבו לנו בשנה שעברה."],["I have a friend ___ father is a pilot.","whose","who","which","יש לי חבר שאבא שלו טייס."],["The phone ___ I bought is great.","that","who","where","הטלפון שקניתי מעולה."],["Do you know the man ___ is standing there?","who","which","whose","אתם מכירים את האיש שעומד שם?"]]},{"e":"🌦️","t":"משפטי תנאי: Zero ו־First","rule":"<b>Zero</b>: עובדה שתמיד נכונה.<br>If + present, present<br>If you heat ice, it <b>melts</b>.<br><br><b>First</b>: אפשרות אמיתית בעתיד.<br>If + present, will + verb<br>If it rains, I <b>will</b> stay home.<br><br>שימו לב: אחרי if לא כותבים will.","ex":[["If you heat ice, it melts.","אם מחממים קרח, הוא נמס."],["If it rains, I will stay home.","אם ירד גשם, אשאר בבית."]],"q":[["If you heat water to 100 degrees, it ___.","boils","boiled","would boil","אם מחממים מים ל־100 מעלות, הם רותחים."],["If it ___ tomorrow, we will stay home.","rains","will rain","rained","אם ירד גשם מחר, נישאר בבית."],["If you study, you ___ pass the exam.","will","would","are","אם תלמדי, תעברי את המבחן."],["If I see Dana, I ___ tell her.","will","would","did","אם אראה את דנה, אגיד לה."],["If you mix red and blue, you ___ purple.","get","got","would get","אם מערבבים אדום וכחול, מקבלים סגול."],["If she ___ late, we will start without her.","is","will be","was","אם היא תאחר, נתחיל בלעדיה."]]},{"e":"💭","t":"משפטי תנאי: Second ו־Third","rule":"<b>Second</b>: מצב דמיוני בהווה.<br>If + past, would + verb<br>If I had money, I <b>would</b> travel.<br>עם to be כותבים were: If I <b>were</b> rich...<br><br><b>Third</b>: חרטה על משהו שכבר קרה.<br>If + had + V3, would have + V3<br>If I had studied, I <b>would have</b> passed.","ex":[["If I were rich, I would travel.","אם הייתי עשירה, הייתי מטיילת."],["If I had studied, I would have passed.","אם הייתי לומדת, הייתי עוברת."]],"q":[["If I ___ rich, I would buy a big house.","were","am","will be","אם הייתי עשירה, הייתי קונה בית גדול."],["If I had more time, I ___ learn Spanish.","would","will","did","אם היה לי יותר זמן, הייתי לומדת ספרדית."],["If she ___ harder, she would have passed.","had studied","studied","has studied","אם היא הייתה לומדת יותר, היא הייתה עוברת."],["If we had left earlier, we ___ the train.","would have caught","would catch","caught","אם היינו יוצאים מוקדם יותר, היינו תופסים את הרכבת."],["What would you do if you ___ the lottery?","won","win","will win","מה היית עושה אם היית זוכה בלוטו?"],["If I had known, I ___ you.","would have told","would tell","told","אם הייתי יודעת, הייתי מספרת לך."]]},{"e":"🔄","t":"סביל: Passive Voice","rule":"כשחשוב <b>מה קרה</b> ולא מי עשה: <b>be</b> + פועל בצורה השלישית (V3).<br>הווה: is made · עבר: was built · עתיד: will be sent.","ex":[["The phone is made in China.","הטלפון מיוצר בסין."],["The house was built in 1950.","הבית נבנה ב־1950."]],"q":[["English ___ all over the world.","is spoken","speaks","is speaking","מדברים אנגלית בכל העולם."],["This house ___ in 1950.","was built","built","is build","הבית הזה נבנה ב־1950."],["The letters ___ tomorrow.","will be sent","will send","are send","המכתבים יישלחו מחר."],["This phone is ___ in China.","made","make","making","הטלפון הזה מיוצר בסין."],["My bike was ___ yesterday.","stolen","stole","steal","האופניים שלי נגנבו אתמול."],["The rooms ___ every day.","are cleaned","clean","are cleaning","החדרים מנוקים כל יום."]]},{"e":"⏮️","t":"עבר מושלם: Past Perfect","rule":"<b>had</b> + V3: משהו שקרה <b>לפני</b> דבר אחר בעבר.<br>When I arrived, the train <b>had left</b> = כשהגעתי, הרכבת כבר יצאה.","ex":[["The train had left.","הרכבת כבר יצאה."],["I had never seen snow.","מעולם לא ראיתי שלג (עד אז)."]],"q":[["When we arrived, the movie ___ already started.","had","has","have","כשהגענו, הסרט כבר התחיל."],["She was tired because she had ___ all day.","worked","work","working","היא הייתה עייפה כי היא עבדה כל היום."],["I ___ never seen snow before I went to Canada.","had","have","has","מעולם לא ראיתי שלג לפני שנסעתי לקנדה."],["After he had ___ dinner, he went to sleep.","eaten","ate","eat","אחרי שהוא אכל ארוחת ערב, הוא הלך לישון."],["They didn't come because they ___ forgotten.","had","has","have","הם לא באו כי הם שכחו."],["By 10 o'clock, everyone had ___.","left","leave","leaving","עד השעה עשר, כולם כבר הלכו."]]},{"e":"⌛","t":"Past Perfect Progressive","rule":"<b>had been</b> + פועל + <b>ing</b>: פעולה שנמשכה זמן מה עד רגע מסוים בעבר.<br>I had been waiting for an hour when the bus came.","ex":[["I had been waiting for an hour.","חיכיתי כבר שעה (עד אותו רגע)."],["It had been raining all night.","ירד גשם כל הלילה (לפני כן)."]],"q":[["I had been ___ for an hour when the bus came.","waiting","waited","wait","חיכיתי כבר שעה כשהאוטובוס הגיע."],["She was tired because she ___ been running.","had","has","have","היא הייתה עייפה כי היא רצה."],["They had been ___ for years before they got married.","dating","dated","date","הם יצאו כמה שנים לפני שהתחתנו."],["How long had you ___ studying before the exam?","been","being","be","כמה זמן למדת לפני המבחן?"],["It had been ___ all night, so the streets were wet.","raining","rained","rain","ירד גשם כל הלילה, לכן הרחובות היו רטובים."],["We had been ___ there for two years when we moved.","living","lived","live","גרנו שם כבר שנתיים כשעברנו דירה."]]},{"e":"🎯","t":"שם פועל: ing או to + פועל","rule":"אחרי <b>enjoy, finish, mind, avoid</b> ואחרי מילות יחס (good at) באים פועל + <b>ing</b>.<br>אחרי <b>want, need, decide, hope, plan</b> באים <b>to</b> + פועל.","ex":[["I enjoy swimming.","אני נהנית לשחות."],["I want to travel.","אני רוצה לטייל."]],"q":[["I enjoy ___ to music.","listening","to listen","listen","אני נהנית להקשיב למוזיקה."],["She wants ___ a doctor.","to become","becoming","become","היא רוצה להיות רופאה."],["He finished ___ the report.","writing","to write","write","הוא סיים לכתוב את הדוח."],["We decided ___ to Italy.","to go","going","go","החלטנו לנסוע לאיטליה."],["I'm good at ___.","cooking","to cook","cook","אני טובה בבישול."],["Avoid ___ too much sugar.","eating","to eat","eat","הימנעו מלאכול יותר מדי סוכר."]]},{"e":"🗣️","t":"דיבור עקיף: Reported Speech","rule":"כשמספרים מה מישהו אמר, הזמן זז צעד אחורה: am/is ← <b>was</b>, are ← <b>were</b>, will ← <b>would</b>, can ← <b>could</b>, like ← <b>liked</b>.<br>\"I am tired.\" ← She said (that) she <b>was</b> tired.","ex":[["She said she was tired.","היא אמרה שהיא עייפה."],["He said he would call.","הוא אמר שהוא יתקשר."]],"q":[["\"I am tired.\" She said that she ___ tired.","was","is","am","\"אני עייפה.\" היא אמרה שהיא עייפה."],["\"I will call you.\" He said he ___ call me.","would","will","can","\"אני אתקשר אלייך.\" הוא אמר שהוא יתקשר אליי."],["\"I can swim.\" Tom said he ___ swim.","could","can","will","\"אני יודע לשחות.\" תום אמר שהוא יודע לשחות."],["\"I like pizza.\" She said she ___ pizza.","liked","likes","like","\"אני אוהבת פיצה.\" היא אמרה שהיא אוהבת פיצה."],["\"We are leaving.\" They said they ___ leaving.","were","are","was","\"אנחנו יוצאים.\" הם אמרו שהם יוצאים."],["\"Where do you live?\" He asked me where I ___.","lived","live","do live","\"איפה את גרה?\" הוא שאל אותי איפה אני גרה."]]},{"e":"🛫","t":"עתיד ממושך: Future Progressive","rule":"<b>will be</b> + פועל + <b>ing</b>: פעולה שתהיה באמצע ברגע מסוים בעתיד.<br>This time tomorrow I <b>will be flying</b> = מחר בשעה כזאת אהיה באמצע טיסה.","ex":[["This time tomorrow I will be flying.","מחר בשעה כזאת אהיה בטיסה."],["Don't call at 9, I will be sleeping.","אל תתקשרו בתשע, אני אהיה ישנה."]],"q":[["This time tomorrow, I will be ___ to London.","flying","fly","flew","מחר בשעה כזאת אהיה בטיסה ללונדון."],["At 8 tonight, we ___ be watching the game.","will","are","were","הערב בשמונה נצפה במשחק."],["Don't call at 9. I will be ___.","sleeping","sleep","slept","אל תתקשרו בתשע. אני אהיה ישנה."],["She will ___ working all day tomorrow.","be","being","been","היא תעבוד כל היום מחר."],["What will you be ___ next week at this time?","doing","do","did","מה תעשו בשבוע הבא בשעה כזאת?"],["They will be ___ dinner when you arrive.","having","have","had","הם יאכלו ארוחת ערב כשתגיעו."]]},{"e":"🏁","t":"עתיד מושלם: Future Perfect","rule":"<b>will have</b> + V3: משהו שיסתיים <b>לפני</b> זמן מסוים בעתיד.<br>By next year, I <b>will have finished</b> my degree = עד שנה הבאה אסיים את התואר.","ex":[["By June, I will have finished.","עד יוני אסיים."],["By 6, she will have left.","עד שש היא כבר תצא."]],"q":[["By next year, I will have ___ my degree.","finished","finish","finishing","עד שנה הבאה אסיים את התואר שלי."],["By 6 pm, she ___ have left.","will","would","is","עד שש בערב היא כבר תצא."],["Next month, we will have ___ here for ten years.","lived","live","living","בחודש הבא נגור כאן כבר עשר שנים."],["By the time you arrive, I will ___ cooked dinner.","have","has","be","עד שתגיעו, כ  let html=`<div class="card map-head"><span class="me">${s.e}</span><div style="flex:1"><h1>${s.t} <span class="en" style="font-size:20px;opacity:.6">${s.en}</span></h1><div class="ms">⭐ ${secStars(sec)} / ${s.n*3} כוכבים · ${s.n} רמות</div></div>
  <button class="btn yellow" data-a="timer" data-sec="${sec}">⏱️ אתגר 60 שניות<small>השיא שלך: ${S.best[sec]}</small></button></div>`;
 s.worlds.forEach(w=>{html+=`<div class="world" style="background:${w.bg}"><div class="world-title">${w.e} ${w.n}</div><div class="world-sub">${w.d} · רמות ${w.from+1}–${w.to}</div><div class="path">`;
  for(let i=w.from;i<w.to;i++){const st=starsOf(sec,i),un=unlocked(sec,i),cls=st?"done":un?"open":"locked",off=offs[i%8];
   const label=sec==="grammar"?`<div style="font-size:14px;margin-top:2px">${GRAMMAR[i].e} ${enWrap(GRAMMAR[i].t)}</div>`:"";
   if(i>w.from)html+=`<div class="dots" style="transform:translateX(${(offs[(i-1)%8]+off)/2}px)"></div>`;
   html+=`<div class="node-row" style="transform:translateX(${off}px)">${i===cur?`<span class="here ${off>=0?"l":"r"}">📍</span>`:""}<button class="node ${cls}" data-a="level" data-sec="${sec}" data-lv="${i}" aria-label="רמה ${i+1}${un?"":" נעולה"}">${un?i+1:"🔒"}</button><div class="node-stars">${st?starStr(st):""}</div>${i===S.start[sec]&&i>0&&!st?`<div class="fit-tag">מותאם לרמה שלך</div>`:""}${label}</div>`;}
  html+=`</div></div>`;});
 return html;};

/* ---------- questions ---------- */
function options(w,field,pool){const seen=new Set([w[field].toLowerCase()]),out=[];
 for(const id of shuffle(pool).concat(shuffle(WORDS.map(x=>x.id)))){if(out.length===3)break;const x=WORDS[id];if(x.id===w.id)continue;const k=x[field].toLowerCase();if(seen.has(k))continue;seen.add(k);out.push(x);}
 return shuffle(out.concat([w])).map(x=>({label:x[field],ok:x.id===w.id,en:field==="en"}));}
function build(d,pool){
 if(d.t==="t")return buildTravel(d);
 if(d.t==="sp"){const w=WORDS[d.id];return {d,kind:"spell",wid:w.id,ins:"הקשיבו וכתבו את המילה באנגלית ✍️",ask:`${EMO[w.en]?`<div class="q-emoji" style="font-size:72px">${EMO[w.en]}</div>`:""}<div class="q-word" style="font-size:30px">${w.he}</div><button class="q-listen small-l" data-a="say" data-t="${esc(w.en)}" aria-label="השמעה">${I.vol}</button>`,opts:[],auto:w.en,after:w.en,ans:w.en,hint:0,fb:`<b class="en">${w.en}</b> = ${w.he}${w.tr?` · 🗣️ ${w.tr}`:""}`};}
 if(d.t==="w"){const w=WORDS[d.id];let k=d.kind;if(k==="pic"&&!EMO[w.en])k="en2he";
  const base={d,kind:k,wid:w.id,after:w.en,fb:`<b class="en">${w.en}</b> = ${w.he}${w.tr?` · 🗣️ ${w.tr}`:""}`};
  if(k==="pic")return Object.assign(base,{ins:"איזו מילה מתאימה לתמונה? 🖼️",ask:`<div class="q-emoji">${EMO[w.en]}</div>`,opts:options(w,"en",pool)});

function heToLatin(w){const M={"א":"a","ב":"b","ג":"g","ד":"d","ה":"h","ו":"o","ז":"z","ח":"ch","ט":"t","י":"i","כ":"k","ך":"ch","ל":"l","מ":"m","ם":"m","נ":"n","ן":"n","ס":"s","ע":"a","פ":"p","ף":"f","צ":"tz","ץ":"tz","ק":"k","ר":"r","ש":"sh","ת":"t"};
 return w.split(" ").filter(Boolean).map(x=>{let o="";for(let i=0;i<x.length;i++){const c=x[i];if(/\d/.test(c)){o+=c;continue;}
   if(c==="ו"&&(i===0||x[i+1]==="ו")){o+="v";if(x[i+1]==="ו")i++;continue;}if(c==="י"&&i===0){o+="y";continue;}if(c==="ה"&&i===x.length-1){o+="a";continue;}if(c==="ב"&&i>0){o+="v";continue;}o+=M[c]||c;}
   if(!/[אוי ע]/.test(x.replace(/ה$/,""))&&x.length>=2&&!/\d/.test(x)){o=o.replace(/^(ch|sh|tz|[a-z])/,"$1a");if(x.length>=4)o=o.replace(/(ch|sh|tz|[a-z])$/,"e$1");}return o.charAt(0).toUpperCase()+o.slice(1);}).join(" ");}

function botPlace(text){const n=normHe(text);

function speakItems(){const nl=nextLevel("words");const pool=ORDER.slice(Math.max(0,(nl-1)*13),(nl+1)*13);
 const learned=ORDER.slice(0,(nl+1)*13).filter(w=>S.learned[w.id]);
 const words=shuffle(learned.length>=5?learned.concat(pool):pool).filter((w,i,a)=>a.indexOf(w)===i).slice(0,5).map(w=>({en:w.en,he:w.he,tr:w.tr,w:1}));
 const ts=Math.max(0,TRAVEL.findIndex((x,i)=>!S.tdone[i]));
 const ph=shuffle(TRAVEL[ts].p.concat(TRAVEL[(ts+1)%TRAVEL.length].p).filter(p=>p.en.split(" ").length<=6)).slice(0,3);
 return words.concat(ph.map(p=>({en:p.en,he:p.he,tr:p.tr,w:0})));}
function startSpeak(){SPK={items:speakItems(),i:0,ok:0,coins:0,state:"idle",heard:"",score:null,url:null,tries:0};go("speak");}
const normEn=s=>String(s).toLowerCase().replace(/[’']/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function simScore(target,alts){const t=normEn(target);let best=0,bestTxt="";for(const a of alts){const h=normEn(a);if(!h)continue;
  let s=1-lev(t,h)/Math.max(t.length,h.length);if(h.split(" ").includes(t))s=Math.max(s,.95);if(s>best){best=s;bestTxt=a;}}return {s:Math.round(best*100),txt:bestTxt};}

 const self=!SR&&SPK.url&&SPK.score==null?`<div class="sp-self"><span>איך יצא?</span><button class="btn mint" data-a="sp-self" data-ok="1">נשמע לי נכון ✓</button><button class="btn ghost" data-a="sp-self" data-ok="0">עוד פעם</button></div>`:"";

async function spRec(){if(!SPK)return;if(SPK.state==="rec"){stopRec();return;}
 speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel();
 SPK.heard="";SPK.score=null;SPK.selfok=false;
 try{MSTREAM=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){spkErr(`🎙️ צריך לאשר גישה למיקרופון. לוחצים על סמל המנעול ליד הכתובת ← מיקרופון ← אפשר.`);return;}
 const chunks=[];try{MREC=new MediaRecorder(MSTREAM);MREC.ondataavailable=e=>chunks.push(e.data);MREC.onstop=()=>{if(SPK.url)URL.revokeObjectURL(SPK.url);SPK.url=URL.createObjectURL(new Blob(chunks,{type:MREC.mimeType||"audio/webm"}));MSTREAM.getTracks().forEach(t=>t.stop());if(VIEW.name==="speak")render();};MREC.start();}catch(e){MREC=null;}
 SPK.state="rec";render();
 if(SR){REC=new SR();REC.lang="en-US";REC.maxAlternatives=5;REC.interimResults=false;
  REC.onresult=e=>{const alts=[...e.results[0]].map(r=>r.transcript);const it=SPK.items[SPK.i];const r=simScore(it.en,alts);SPK.heard=r.txt||alts[0]||"";SPK.score=r.s;SPK.tries++;
   if(r.s>=85){sfx("ok");if(!S.spk[it.en+today()]){S.spk[it.en+today()]=1;SPK.ok++;SPK.coins+=2;addCoins(2,"הגייה מצוינת");}}else sfx("bad");};
  REC.onerror=e=>{if(e.error==="not-allowed")spkErr("🎙️ צריך לאשר גישה למיקרופון.");else if(e.error==="no-speech")spkErr("לא שמעתי כלום. נס"+G("י","ה")+" לדבר קרוב יותר לטלפון.");else if(e.error==="network")spkErr("זיהוי הדיבור צריך אינטרנט.");};

 return `<div class="tu-bar"><span>${sc.e} ${sc.t}</span><button class="tu-new" data-a="tut-reset">מצב אחר</button></div>
  <div class="chat" id="tchat" aria-live="polite">${msgs}</div>${sug}
  <form class="botf" id="tutf"><button type="button" class="tu-mic ${TREC?"rec":""}" data-a="tut-mic" aria-label="${ex?"דיבור בעברית":"דיבור באנגלית"}">${TREC?"⏹":"🎤"}</button><input id="tutq" autocomplete="off" maxlength="200" ${ex?"":`dir="auto"`} placeholder="${ex?"מה לא הבנת? למשל: מתי אומרים does":"Write in English..."}" aria-label="הודעה למורה"><button class="btn" type="submit">${TUT.busy?"⏳":"שליחה"}</button></form>
  <div class="err" id="tuterr"></div><div class="small muted center">נשארו להיום ${left} הודעות</div>`;}
function tutStart(k){TUT={scen:k,msgs:[],busy:false};
 if(k==="explain"){TUT.msgs.push({r:"t",he:`שאל${G("י","")} אותי כל דבר שלא היה ברור באנגלית: מילה, משפט או חוק בדקדוק. אני אסביר בעברית פשוטה, עם דוגמה.`,en:"",sug:["מה ההבדל בין a ל־the?","מתי מוסיפים s לפועל?"]});}
 else{const o=OFF_TUT[k][0];TUT.msgs.push({r:"t",en:o[0],he:o[1],tr:"",sug:o[2],step:0});if(!S.mute)setTimeout(()=>speak(o[0]),300);}
 renderOwl();}
async function askTutor(){const msgs=TUT.msgs.filter(m=>!m.wait).map(m=>({r:m.r,t:m.r==="u"?m.t:(m.en||m.he)})).slice(-10);
 const eng=engineName();
 if(eng==="claude"){const sc=TUT.scen;const hist=msgs.map(m=>(m.r==="t"?"Tutor: ":"Learner: ")+m.t).join("\n");
  const prompt=sc==="explain"?`You are "Yanshufi", a warm English teacher for Hebrew speakers. Explain the learner's last question in simple Hebrew (max 60 words, ${S.gender==="m"?"masculine":"feminine"} form), with one short English example.\nConversation:\n${hist}\nReply ONLY JSON: {"he":"...","en":"example","tr":"pronunciation in Hebrew letters","fix":null,"tip":"","sug":["follow-up question in Hebrew","another"]}`
   :`You are "Yanshufi", a warm English conversation tutor for a Hebrew speaker with low English. Role play: ${({cafe:"barista in a London cafe",hotel:"hotel receptionist",border:"passport control officer",shop:"clothing shop assistant",street:"local person giving directions",free:"friendly teacher chatting"})[sc]}. Very simple English, max 2 sentences, end with a question.\nConversation:\n${hist}\nReply ONLY JSON: {"en":"tutor's next line","he":"Hebrew translation","tr":"pronunciation in Hebrew letters","fix":null or {"wrong":"...","right":"corrected sentence","why":"short Hebrew reason, ${S.gender==="m"?"masculine":"feminine"} form"},"tip":"short Hebrew encouragement or empty","sug":["simple answer","another"]}. Only fix real mistakes in the learner's last message.`;
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),15000);let r;try{r=await SAMPLE(prompt,{modelTier:"quick",cache:false,signal:ac.signal});}finally{clearTimeout(to);}
  const m=((r&&r.text)||"").match(/\{[\s\S]*\}/);if(!m)throw new Error("no json");return JSON.parse(m[0]);}
 const ac=new AbortController();const to=setTimeout(()=>ac.abort(),16000);
 try{const r=await fetch("/api/bot",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({mode:"tutor",scen:TUT.scen,msgs,g:S.gender==="m"?"m":"f"}),signal:ac.signal});
  if(r.status===404||r.status===405){GEM=false;throw new Error("no_function");}
  const d=await r.json().catch(()=>({}));if(!r.ok||!d.answer){if(d.error==="no_key")GEM=false;throw Object.assign(new Error(d.error||"error"),{code:d.error});}
  GEM=true;return d.answer;}finally{clearTimeout(to);}}
function offlineTutor(){if(TUT.scen==="explain")return {he:"כדי להסביר שאלות חופשיות אני צריך חיבור לאינטרנט. בינתיים אפשר ללמוד את החוקים במסך הדקדוק ✏️",en:"",sug:[]};
 const steps=OFF_TUT[TUT.scen];const last=[...TUT.msgs].reverse().find(m=>m.r==="t"&&m.step!=null);const n=(last?last.step:0)+1;
 if(n>=steps.length)return {en:"Great job! You did it! 🎉",he:"כל הכבוד! סיימת את השיחה!",tip:"אפשר לבחור מצב אחר ולהמשיך לתרגל",sug:[],step:n};
 const o=steps[n];return {en:o[0],he:o[1],tr:"",sug:o[2],step:n};}
async function tutorSend(q){q=(q||"").trim();const err=$("#tuterr");if(!q){if(err)err.textContent=TUT.scen==="explain"?"כתב"+G("י","")+" שאלה קודם 🙂":"Write something first 🙂";return;}
 if(TUT.busy)return;
 const eng=engineName();
 if(eng&&tutorLeft()<=0){if(err)err.innerHTML=`נגמרו ההודעות להיום. אפשר לקנות עוד 10 הודעות ב־40 🪙 <button class="chip2" data-a="go-shop">לחנות</button>`;return;}
 TUT.msgs.push({r:"u",t:q});const inp=$("#tutq");if(inp)inp.value="";
 if(!eng){const a=offlineTutor();TUT.msgs.push(Object.assign({r:"t"},a));renderOwl();if(a.en&&!S.mute)setTimeout(()=>speak(a.en),250);return;}
 TUT.busy=true;TUT.msgs.push({r:"t",wait:1,wl:Math.floor(Math.random()*OWL_WAIT.length)});renderOwl();
 let a=null;try{a=await askTutor();useTutorMsg();}
 catch(e){if(eng==="claude"&&e&&(e.code==="not_granted"||e.code==="unavailable"))SAMPLE=null;if(e&&(e.code==="quota"||e.code==="rate_limited"))toast("ינשופי עמוס כרגע, ממשיכים בתרגול המוכן 📚",2600);a=offlineTutor();}
 finally{TUT.busy=false;TUT.msgs=TUT.msgs.filter(m=>!m.wait);}
 const clean=v=>String(v||"").replace(/הוּ-הוּ[!,.]?\s*|הו-הו[!,.]?\s*/g,"");
 const m={r:"t",en:clean(a.en),he:clean(a.he),tr:clean(a.tr),fix:a.fix&&a.fix.right?a.fix:null,tip:clean(a.tip),sug:Array.isArray(a.sug)?a.sug.slice(0,3):[],step:a.step};
 TUT.msgs.push(m);if(TUT.msgs.length>40)TUT.msgs=TUT.msgs.slice(-40);
 if(m.fix)sfx("click");else sfx("ok");if(m.en&&!S.mute&&TUT.scen!=="explain")setTimeout(()=>speak(m.en),250);renderOwl();}
let TREC=null;
function tutMic(){if(TREC){stopTutRec();return;}if(!SR){toast("הדפדפן הזה לא תומך בדיבור. אפשר לכתוב 🙂 (עובד בכרום)",2800);return;}
 TREC=new SR();TREC.lang=TUT.scen==="explain"?"he-IL":"en-US";TREC.interimResults=true;
 TREC.onresult=e=>{const t=[...e.results].map(r=>r[0].transcript).join(" ");const i=$("#tutq");if(i)i.value=t;if(e.results[e.results.length-1].isFinal){stopTutRec();tutorSend(t);}};
 TREC.onerror=e=>{const er=$("#tuterr");if(er)er.textContent=e.error==="not-allowed"?"🎙️ צריך לאשר גישה למיקרופון.":e.error==="no-speech"?"לא שמעתי. נס"+G("י","ה")+" שוב.":"";stopTutRec();};
 TREC.onend=()=>{if(TREC){TREC=null;renderOwl();}};try{TREC.start();}catch(e){}renderOwl();}
function stopTutRec(){const r=TREC;TREC=null;try{r&&r.stop();}catch(e){}if(OWLP.open&&OWLP.tab==="tutor")renderOwl();}

/* ---------- actions ---------- */
const ACT={
 back(){const [n,o]=backTarget();go(n,o);},
 home(){go("home");},
 lessons(){if(!S.placed){PT={i:-1,score:0,done:false};go("placement");return;}go("lessons");},
 bot(){openOwl("say");},
 "owl-open"(){openOwl();},"owl-close"(){closeOwl();},"owl-tab"(d){OWLP.tab=d.tab;renderOwl();},
 "tut-scen"(d){tutStart(d.k);},"tut-sug"(d){tutorSend(d.q);},"tut-reset"(){TUT={scen:null,msgs:[],busy:false};renderOwl();},"tut-mic"(){tutMic();},
 "go-shop"(){closeOwl();go("shop");},shop(){go("shop");},buy(d){buy(d.k);},use(d){useItem(d.k);},cert(){showCert();},"cert-share"(){shareCert();},"sheet-x"(){closeSheet();},
 focus(d){pickFocus(d.k);},"focus-later"(){S.focusDay=today();save();closeSheet();},
 speak(){startSpeak();},"speak-again"(){startSpeak();},"sp-rec"(){spRec();},"sp-play"(){spPlay();},
 "sp-next"(){if(!SPK)return;SPK.i++;SPK.state="idle";SPK.heard="";SPK.score=null;SPK.selfok=false;if(SPK.url){URL.revokeObjectURL(SPK.url);SPK.url=null;}render();if(SPK.i<SPK.items.length&&!S.mute){const it=SPK.items[SPK.i];setTimeout(()=>speak(it.en),300);}},
 "sp-self"(d){if(!SPK)return;if(d.ok==="1"){SPK.selfok=true;SPK.score=null;const it=SPK.items[SPK.i];if(!S.spk[it.en+today()]){S.spk[it.en+today()]=1;SPK.ok++;SPK.coins+=2;addCoins(2,"כל הכבוד");}render();}else spRec();},
 hint(){useHint();},tutor(){openOwl("tutor");},
 plan(d){const P=planState();const x=P.steps.find(y=>y.k===+d.k)||P.steps[0];x.act();},
 mute(){S.mute=!S.mute;save();if(S.mute&&HAS_TTS)speechSynthesis.cancel();const b=document.querySelector('[data-a="mute"]');if(b){b.innerHTML=S.mute?I.mute:I.vol;}toast(S.mute?"🔇 הצלילים כבויים":"🔊 הצלילים פועלים",1300);},
 sec(d){if(!S.placed){PT={i:-1,score:0,done:false};go("placement");return;}go("map",{sec:d.sec});},
 level(d){const sec=d.sec,lv=+d.lv;S.lastSec=sec;save();if(!unlocked(sec,lv)){sfx("bad");toast("🔒 קודם צריך לעבור את הרמה הקודמת");return;}
   if(sec==="words"||sec==="sentences")go("intro",{sec,lv});else go("rule",{sec,lv});},
 start(){startLevel(VIEW.sec,VIEW.lv);},
 retry(){startLevel(RES.sec,RES.lv);},
 "st-next"(){if(STUDY_I<WLEVELS[VIEW.lv].length-1){STUDY_I++;render();}else startLevel(VIEW.sec,VIEW.lv);},
 "st-prev"(){if(STUDY_I>0){STUDY_I--;render();}},
 timer(d){if(HAS_TTS)speechSynthesis.cancel();startTimer(d.sec);},
 review(){const w=dueWords();if(!w.length){toast("🧠 אין מילים לחזרה כרגע. תשחקו ברמות, והמשחק יזכור מה לחזור עליו!",3400);return;}startWordsSession("review",w);},
 favs(){go("fav");},
 "fav-play"(){startWordsSession("fav",favWords());},
 fav(d){toggleFav(+d.id);},
 say(d){speak(d.t);},
 slow(d){speakSlow(d.t);},
 ans(d){answer(+d.i);},
 next(){nextQ();},
 profile(){go("profile");},
 rename(){WEL_G=S.gender;go("welcome");},
 reset(d,el){if(el.dataset.sure!=="1"){el.dataset.sure="1";el.textContent="⚠️ בטוח? הכול יימחק. לחצו שוב";return;}{const nm=S.name,g=S.gender;S=JSON.parse(JSON.stringify(DEF));S.name=nm;S.gender=g;save();PT={i:-1,score:0,done:false};go("placement");toast("ההתקדמות אופסה 🌱");}},
 gender(d){WEL_G=d.g;document.querySelectorAll(".gbtn[data-g]").forEach(b=>b.classList.toggle("on",b.dataset.g===d.g));},
 goal(d){WEL_GOAL=d.k;document.querySelectorAll(".gbtn.goal").forEach(b=>b.classList.toggle("on",b.dataset.k===d.k));},
 "welcome-go"(){const v=$("#nm").value.trim();if(!v){$("#err").textContent="כתבו את השם שלכם כדי להתחיל";$("#nm").focus();return;}S.name=v;S.gender=WEL_G;if(WEL_GOAL)S.goal=WEL_GOAL;save();sfx("fanfare");if(S.placed){confetti();go("home");}else{PT={i:-1,score:0,done:false};go("placement");}},
 retest(){PT={i:0,score:0,done:false,re:true};go("placement");},
 "pt-start"(){PT.i=0;render();},
 "pt-ans"(d){if(PT.lock)return;PT.lock=true;const q=PLACEMENT[PT.i],ok=+d.i===q.ok;if(ok){PT.score++;PT.wr=0;sfx("ok");}else{PT.wr=(PT.wr||0)+1;sfx("click");}
   const bs=document.querySelectorAll(".opt");bs[+d.i].classList.add("sel-pt");bs[+d.i].style.background="var(--lav)";bs[+d.i].style.borderColor="var(--lav2)";
   setTimeout(()=>{PT.lock=false;PT.i++;if(PT.i>=PLACEMENT.length||(PT.wr>=3&&PT.i>=4)){PT.early=PT.i<PLACEMENT.length;finishPlacement();}render();},380);},
 "pt-go"(){go("home");},
 "st-jump"(d){STUDY_I=+d.k;render();},
 spell(){startSpell(VIEW.lv);},
 "spell-again"(){startSpell(RES.lv);},
 "sp-hint"(){const q=SES&&SES.cur;if(!q||q.kind!=="spell"||SES.answered)return;q.hint=Math.min(q.hint+1,q.ans.length);const h=$("#sphint");if(h)h.textContent=q.ans.slice(0,q.hint)+q.ans.slice(q.hint).replace(/[A-Za-z]/g," _");},
 travel(){if(!S.placed){PT={i:-1,score:0,done:false};go("placement");return;}go("travel",{tab:"route"});},
 ttab(d){if(d.tab==="bot"){openOwl("say");return;}go("travel",{tab:d.tab});},
 tstage(d){go("tstage",{ts:+d.ts});},
 tquiz(d){startTravelQuiz(+d.ts);},
 tfav(d){toggleTFav(d.k);},
 "bot-ask"(d){botAsk(d.q);},
 show(d){showBig(d.k);},
 "close-show"(){closeBig();},
 "bot-from-search"(){const q=TSQ.trim();openOwl("say");if(q){TSQ="";botAsk(q);}},
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;ac();const a=el.dataset.a;
 if(!["ans","pt-ans","say","slow","fav","tfav","mute","bot-ask"].includes(a))sfx("click");if(ACT[a])ACT[a](el.dataset,el);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#bigshow")){closeBig();return;}if(VIEW.name!=="play")return;const n=+e.key;if(SES&&SES.cur.kind==="spell")return;if(n>=1&&n<=4&&SES&&!SES.answered&&SES.cur.opts[n-1])answer(n-1);
 if(e.key==="Enter"&&document.querySelector('[data-a="next"]')){e.preventDefault();nextQ();}});

if(!S.name)go("welcome");else if(!S.placed){PT={i:-1,score:0,done:false};go("placement");}else go("home");
</script>
